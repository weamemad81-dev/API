services:
  db:
    image: mysql:8.0
    container_name: library_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-library_db}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD:-123456}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  library_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_system_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=library_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-123456};
    stdin_open: true
    tty: true

volumes:
  mysql_data: